# ═══════════════════════════════════════════════════════════════
# Easy Proxies 完整配置文件
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 运行模式
# ───────────────────────────────────────────────────────────────
# pool: 单端口代理池，所有节点共享一个端口，自动负载均衡
# multi-port: 多端口模式，每个节点独立端口
# hybrid: 混合模式，同时启用 pool + multi-port
# 运行拓扑已固定为双栈：共享 pool 入口 + 每节点独立端口同时启动。
# mode 字段不再生效（旧值会被忽略，保留仅供旧配置文件解析）。
# mode: pool

# 日志级别: debug, info, warn, error
log_level: info

# ───────────────────────────────────────────────────────────────
# 日志轮转配置
# ───────────────────────────────────────────────────────────────
# output: "stdout"（仅控制台）或 "file"（控制台+文件轮转），默认 stdout
# file: 日志文件路径，默认 logs/easy_proxies.log
# max_size: 单个日志文件最大 MB，超出后自动轮转，默认 50
# max_backups: 保留旧日志文件个数，默认 3
# max_age: 保留旧日志文件天数，默认 7
# compress: 是否压缩轮转后的旧日志，默认 false
log:
  output: stdout
  file: logs/easy_proxies.log
  max_size: 50
  max_backups: 3
  max_age: 7
  compress: false

# 全局跳过 SSL 证书验证（默认 false，不建议在生产环境启用）
skip_cert_verify: false

# 外部 IP 地址，用于导出配置时替换 0.0.0.0（可选）
# external_ip: "your.public.ip"

# ───────────────────────────────────────────────────────────────
# 监听配置（Pool 模式入口，支持 HTTP/SOCKS5）
# ───────────────────────────────────────────────────────────────
listener:
  address: 0.0.0.0      # 监听地址
  port: 2323            # 监听端口
  username: username    # 代理认证用户名
  password: password    # 代理认证密码

# ───────────────────────────────────────────────────────────────
# 代理池配置
# ───────────────────────────────────────────────────────────────
pool:
  # 调度模式: sequential（顺序）, random（随机）, balance（均衡）, latency（最低延迟）
  mode: sequential
  # 连续失败多少次后加入黑名单
  failure_threshold: 3
  # 黑名单持续时间（建议 1h-6h，默认 24h 可能过长）
  # 节点被黑名单后将完全不可用，直到时间到期或手动释放
  # 可通过 WebUI 或 API 手动释放：POST /api/nodes/{tag}/release
  blacklist_duration: 24h
  # 暂时性故障（超时、连接重置、503）的冷却时间
  # 这类故障通常会自行恢复，不计入 failure_threshold，只临时跳过该节点，到期自动恢复
  # 冷却期间该节点不会被选中；若池内所有节点都在冷却，请求会失败而不是继续打限流节点
  transient_cooldown: 60s
  # 429 限流（Too Many Requests）的冷却时间
  # 留空则跟随 transient_cooldown（注意：在 WebUI 保存过设置后，该值会被固化写入本文件）
  # 共享/免费节点被 CDN 限流时很常见；如需 429 后长时间避开该节点，可设为 2h / 6h 等
  rate_limit_cooldown: 60s
  # 是否启用代理重试：节点拨号失败后自动切换下一个节点重试
  # 多端口模式下池只有 1 个成员，重试会再次拨同一节点
  retry_enabled: true
  # 重试次数（包含首次拨号），默认 3
  retry_attempts: 3
  # 命名会话绑定的节点拨号失败时是否立即拉黑（默认 true）
  # 真实传输故障立刻按 blacklist_duration 拉黑，不必等 failure_threshold 累计；
  # 429/超时类仍只按对应冷却处理。设为 false 则回到阈值累计逻辑（仍会自动换节点重试）
  blacklist_failed_pin: true
  # 用户 / 分池已统一由 WebUI「用户与分池」维护（accounts.json），
  # 旧版 pool.user_pools 写入路径已停用，请勿再在本文件中配置分池。
  # ───────────────────────────────────────────────────────────────
  # 调用方零感知：改道与熔断
  # ───────────────────────────────────────────────────────────────
  # 一次请求内所有改道必须在该预算内完成，超时才向调用方返回失败（默认 3s）
  switch_budget: 3s
  # 单次上游拨号超时；留空表示沿用调用方 context（默认不启用）
  # dial_timeout: 2s
  # 主动健康探测周期（默认 5m，建议弱网络下调到 30s 并配合限速）
  health_interval: 5m
  # 每节点三态熔断（Closed/Open/HalfOpen）；false 可回到纯黑名单+冷却逻辑
  enable_circuit_breaker: true
  # 池内全部节点不可用时：none（默认，不回落）/ default_pool / direct
  fallback: none
  # 独立账号与分池由 WebUI「用户与分池」维护，数据落在本文件同目录的 accounts.json
  # 变更即时生效，无需重载核心，也不会打断在途连接。

# ───────────────────────────────────────────────────────────────
# 会话路由与旧版粘性代理（仅 pool / hybrid 模式生效）
# ───────────────────────────────────────────────────────────────
# 主 listener 端口支持「用户名.sessionID」固定上游节点，普通用户名沿用池调度。
# 要求 listener 已配置非空用户名，密码沿用原认证配置（建议使用非空强密码）。
# 会话 ID 支持 [A-Za-z0-9_-]，长度 1–100。
# 例如 listener.username 为 wang、password 为 "1234" 时：
#   http://wang.account01:1234@127.0.0.1:2323  固定会话
#   http://wang:1234@127.0.0.1:2323            普通调度
# 固定上游节点不等于保证公网出口 IP 永久不变。节点失效时按池重试策略切换，
# 已建立连接不迁移，已发送请求不因 HTTP 业务错误自动重放。
# 固定绑定针对 TCP；UDP 请求需要回退时不改 TCP 绑定，不保证 UDP 固定出口。
# 空闲 TTL 按新连接拨号活动计算；已有长连接中的流量不续期。
# 同一节点 URI 身份的绑定跨订阅刷新/核心重载保留，进程重启后清空。
# enabled / port 仅控制旧「来源 IP」粘性端口，与主入口会话功能相互独立。
sticky:
  session_enabled: true # 主端口会话路由；省略时默认 true
  session_ttl: 24h      # 命名会话空闲释放时长；正时长且不超过 8760h，支持 30m / 24h 等
  max_sessions: 10000   # 命名会话容量，1–100000；超过上限时清理最近最少使用的绑定
  enabled: false        # 是否额外监听旧来源 IP 粘性端口
  port: 2324            # 旧粘性端口（留空或 0 则为 listener.port + 1）

# ───────────────────────────────────────────────────────────────
# 多端口模式配置（multi-port / hybrid 模式使用）
# ───────────────────────────────────────────────────────────────
multi_port:
  address: 0.0.0.0      # 监听地址
  base_port: 24000      # 起始端口号
  username: mpuser      # 默认认证用户名
  password: mppass      # 默认认证密码

# ───────────────────────────────────────────────────────────────
# 管理面板配置
# ───────────────────────────────────────────────────────────────
management:
  enabled: true                                      # 是否启用管理面板
  listen: 0.0.0.0:9091                               # 监听地址
  probe_target: http://cp.cloudflare.com/generate_204  # 健康检查目标
  password: ""                                       # WebUI 访问密码，为空则不需要密码

# ───────────────────────────────────────────────────────────────
# DNS 配置（用于节点域名解析，尤其是 VMess）
# ───────────────────────────────────────────────────────────────
dns:
  server: 223.5.5.5         # DNS 服务器地址
  fallback_servers:          # DNS 解析失败时的备用服务器（主 DNS 为国内 DNS 时自动添加）
    - 8.8.8.8               # Google DNS
    - 1.1.1.1               # Cloudflare DNS
  port: 53                  # DNS 端口
  strategy: prefer_ipv4     # as_is / prefer_ipv4 / prefer_ipv6 / ipv4_only / ipv6_only

# ───────────────────────────────────────────────────────────────
# GeoIP 地域分区配置（可选）
# ───────────────────────────────────────────────────────────────
# 启用后会为节点打上地域标签（jp/kr/us/hk/tw/other），用于 WebUI 统计和筛选。
geoip:
  enabled: true                      # 是否启用 GeoIP 地域标记
  database_path: "./GeoLite2-Country.mmdb"           # GeoIP 数据库路径（首次启动时自动下载）
  auto_update_enabled: true                          # 是否启用自动更新数据库（推荐）
  auto_update_interval: 24h                          # 自动更新间隔（默认 24 小时）
  # 注意：
  #   - 首次启动会自动从 GitHub 下载 GeoIP 数据库（约 9MB）
  #   - 启用 auto_update_enabled 后，数据库会定期自动更新，无需重启容器
  #   - 更新过程采用热重载，不会中断现有连接

# ───────────────────────────────────────────────────────────────
# 订阅自动刷新配置（可选）
# ───────────────────────────────────────────────────────────────
# subscription_refresh:
#   enabled: false              # 是否启用定时刷新
#   interval: 1h                # 刷新间隔（默认 1 小时）
#   timeout: 30s                # 获取订阅的超时时间
#   fetch_concurrency: 16       # 订阅抓取并发数（默认 16，最大 32）
#   health_check_timeout: 60s   # 新节点健康检查超时
#   drain_timeout: 30s          # 旧实例排空超时时间
#   min_available_nodes: 1      # 最少可用节点数，低于此值不切换

# ═══════════════════════════════════════════════════════════════
# 节点配置方式（三选一或混合使用）
# ═══════════════════════════════════════════════════════════════

# ───────────────────────────────────────────────────────────────
# 方式 1: 订阅链接（推荐，自动获取并写入 nodes.txt）
# ───────────────────────────────────────────────────────────────
# subscriptions:
#   - "https://example.com/subscribe?token=xxx"
#   - "https://another.com/api/v1/client/subscribe?token=yyy"

# ───────────────────────────────────────────────────────────────
# 方式 2: 节点文件（每行一个代理 URI）
# ───────────────────────────────────────────────────────────────
# nodes_file: nodes.txt

# ───────────────────────────────────────────────────────────────
# 方式 3: 直接在配置文件中配置节点
# ───────────────────────────────────────────────────────────────
nodes:
  # 最简配置：只需 URI，名称从 # 后自动提取。
  # 此地址仅展示格式，使用前请替换为真实节点；使用订阅/文件时，先配置好
  # 实际来源再删除此示例，避免 lookup server: NXDOMAIN 探测噪声。
  - uri: "vless://uuid@server:443?security=tls&type=ws&path=/path#节点名称"

  # 完整配置：手动指定名称和端口
  # - name: "自定义名称"
  #   uri: "ss://base64@server:8388"
  #   port: 24001              # 手动指定端口（multi-port/hybrid 模式）
  #   username: "custom_user"  # 覆盖默认认证（可选）
  #   password: "custom_pass"

# ───────────────────────────────────────────────────────────────
# 支持的代理协议
# ───────────────────────────────────────────────────────────────
# - VMess:    vmess://base64_encoded_json
# - VLESS:    vless://uuid@server:port?params#name
# - Trojan:   trojan://password@server:port?params#name
# - SS:       ss://method:password@server:port#name
#             ss://base64(method:password)@server:port#name
#             ss://base64(method:password@server:port)#name
# - Hysteria2: hy2://password@server:port?params#name
# - SOCKS5:  socks5://[user:pass@]server:port#name
# - HTTP:    http://[user:pass@]server:port#name
#            https://[user:pass@]server:port#name
# - AnyTLS:  anytls://password@server:443?params#name
# - TUIC:    tuic://uuid:password@server:443?params#name
# 注意：解析器可识别部分额外协议前缀（如 ssr://、hysteria://），
# 但当前内核实际构建仅支持以上 9 类，其他会被跳过并输出日志。
#
# 订阅来源除 http(s) URL 外，还支持本地文件（相对/绝对路径或 file:// 前缀）
# 与内联内容（inline:<base64>），便于直接添加 Clash YAML / Base64 订阅。

